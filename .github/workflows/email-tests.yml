name: Email Validation Tests

on:
  pull_request:
    branches: [main]
    paths: ["validateemail.py", "requirements.txt", "tests/**", ".github/workflows/email-tests.yml"]
  push:
    branches: [main]
    paths: ["validateemail.py", "requirements.txt", "tests/**", ".github/workflows/email-tests.yml"]

permissions:
  contents: read

concurrency:
  group: email-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Email tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Test with synthetic addresses and mocked DNS/SMTP
        run: python -m unittest discover -s tests -v
